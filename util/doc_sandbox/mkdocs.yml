site_name: EXOSIMS-Sandbox
nav:
    - Home: index.md
    - Galleries:
        - Binned Ensemble Galleries: binned-ensemble-gallery.md
        - Ensemble Path Galleries: path-ensemble-gallery.md
        - Single DRM Galleries: single-drm-gallery.md
    - Execution: execution.md
    - Plot Reference:
        # these pages are generated by gen_pages.py from Local/www-doc/*.md,
        # which is also rendered separately for the sandbox web UI.
        # Adding a page here also means adding it to TOPICS in
        # Local/www-doc/Makefile; "make doc-lint" checks the two agree.
        - Observation Timelines: plots/obs-timeline.md
        - Star-Observation Trace: plots/star-obs-trace.md
        - Path Movie: plots/path-movie.md
        - Target Detection Tabulation: plots/detection-tabulation.md
        - Target Promotion Tabulation: plots/promotion-tabulation.md
        - Per-Star Metrics: plots/per-star-metrics.md
        - Planet-Population Densities and Throughputs: plots/planet-population-density.md
        - Characterization Observing Conditions: plots/char-observing-plots.md
        - Radius/Luminosity Plots: plots/radius-luminosity-plots.md
        - Radius/SMA Bin Plots: plots/rad-sma-bin-plots.md
        - Tailoring the Earthlike Planet Class: plots/earthlike-tailoring.md
    - Script Index: script_index.md
    - Key Tools: impl_index.md

# attr_list: the plot pages size images with {: width="100%" }
# md_in_html: lets those pages mix markdown inside HTML blocks
markdown_extensions:
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["..", "../reduce_drm_tools"]
          # Python-specific options (e.g., show source code)
          options:
            docstring_options:
              warn_missing_types: false
            show_source: true
        shell:
          # Shell-specific options -- placeholder
          options:
            setup_commands:
              - source mkdocs_sh_setup.sh

  - gen-files:
      scripts:
        - gen_pages.py  # or any other name or path
            

#theme: 
#  name: "readthedocs"

theme: 
  name: "material"
  features:
    - navigation.tabs
